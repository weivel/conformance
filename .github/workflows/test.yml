name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: cmake
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
      cmake_version: '4.4.4'
      cmake_configure: '-S . -B build'
      cmake_build: '--build build --config Debug'
      cmake_test: 'ctest --test-dir build --output-on-failure -C Debug'

  sanitizers:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: cmake
      runners: '["ubuntu-latest"]'
      cmake_version: '4.4.4'
      cmake_configure: >-
        -S . -B build -DCMAKE_BUILD_TYPE=Debug
        "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
        "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
        "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
      cmake_build: '--build build --config Debug'
      # The core gate tests read the built core, whose sanitizer imports it rightly refuses (see RUNNER.md).
      cmake_test: 'ctest --test-dir build --output-on-failure -C Debug -E "^core_(gate_|reads_nothing_of_the_world$)"'
